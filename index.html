<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Weather App</title>
    <link rel="icon" href="images/clouds.png">
    <link rel="stylesheet" href="index.css">
</head>
<body>

<div class="parent">
    <div class="header">
        <h2>🌤 Weather Check</h2>
        <p id="dateTime" class="date-time"></p>
    </div>

    <div class="search-box">
        <span id="gps-icon" class="gps-icon" title="Use Current Location"><img src="images/map.png" alt ="location"></span>
        
        <input
            type="text"
            id="city"
            class="input-box"
            placeholder="Enter city name..."
        >

        <img src="images/search.png"
             id="search-icon"
             class="search-icon" alt="Search">
    </div>

    <p id="loading" class="loading-spinner">Fetching Weather...</p>

    <div class="weather-body">
        
        <h2 id="displayCityName">City Name</h2>

        <img class="weather-icon"
             src="images/clouds.png" alt="Weather Icon">

        <h1 id="temperature">--°C</h1>
        <h3 id="weather">Weather</h3>

        <div class="details">
            <div class="col">
                <img src="images/humidity.png" alt="Humidity">
                <div>
                    <p id="humidity">--%</p>
                    <h4>Humidity</h4>
                </div>
            </div>

            <div class="col">
                <img src="images/wind.png" alt="Wind">
                <div>
                    <p id="wind">-- km/h</p>
                    <h4>Wind</h4>
                </div>
            </div>
        </div>

        <div class="section">
            <div>
                <p id="feelsLike">--°C</p>
                <span>Feels Like</span>
            </div>
            <div>
                <p id="tempMin">--°C</p>
                <span>Min</span>
            </div>
            <div>
                <p id="tempMax">--°C</p>
                <span>Max</span>
            </div>
        </div>
        
        <div class="section extra-premium">
            <div>
                <p id="pressure">-- hPa</p>
                <span>Pressure</span>
            </div>
            <div>
                <p id="visibility">-- km</p>
                <span>Visibility</span>
            </div>
        </div>

    </div>
</div>

<script src="index.js"></script>
</body>
</html>
